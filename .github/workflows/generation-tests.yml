name: Dashboard generation

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-generation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generation:
    name: Generation (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Install test and existing runtime dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider -Name NuGet -Force -Scope CurrentUser
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSSharedGoods -RequiredVersion 0.0.313 -Scope CurrentUser -Force
          Install-Module PSWriteHTML -RequiredVersion 1.41.0 -Scope CurrentUser -Force
      - name: Validate dashboard generation
        run: ./Tests/Invoke-GenerationTests.ps1
